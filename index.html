<title>cardwallet-template</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Sans:wght@400;500;600&family=Azeret+Mono:wght@400;500;600&display=swap">
<style>
@font-face {
    font-family: 'JoseonGulim';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/ChosunGu.woff') format('woff');
    font-weight: normal;
    font-display: swap;
}
:root{
  --ground:#E9EAEC; --bed:#DEE0E3; --panel:#FDFDFE; --panel-2:#F2F3F5;
  --ink:#16181D; --ink-2:#5C6270; --ink-3:#8B909C;
  --line:#D5D7DC; --line-soft:#E3E5E9;
  --foil:#8F6618; --foil-bg:#C79A3E; --foil-on:#17130A;
  --foil-tint:rgba(199,154,62,.15);
  --shadow-card:0 2px 6px rgba(16,20,28,.14),0 26px 50px -22px rgba(16,20,28,.45);
  --r:10px;
  --display:"JoseonGulim","Apple SD Gothic Neo",sans-serif;
  --body:"JoseonGulim","Apple SD Gothic Neo",sans-serif;
  --mono:"JoseonGulim","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1116; --bed:#0A0C10; --panel:#161A21; --panel-2:#1D222B;
    --ink:#E8EAEF; --ink-2:#99A0AE; --ink-3:#727A88;
    --line:#272D38; --line-soft:#1F242D;
    --foil:#D9AE5C; --foil-bg:#C79A3E; --foil-on:#17130A;
    --foil-tint:rgba(217,174,92,.13);
    --shadow-card:0 2px 8px rgba(0,0,0,.5),0 30px 60px -24px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1116; --bed:#0A0C10; --panel:#161A21; --panel-2:#1D222B;
  --ink:#E8EAEF; --ink-2:#99A0AE; --ink-3:#727A88;
  --line:#272D38; --line-soft:#1F242D;
  --foil:#D9AE5C; --foil-bg:#C79A3E; --foil-on:#17130A;
  --foil-tint:rgba(217,174,92,.13);
  --shadow-card:0 2px 8px rgba(0,0,0,.5),0 30px 60px -24px rgba(0,0,0,.85);
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:22px 36px}

/* ---------- header ---------- */
.masthead{
  padding-bottom:16px;margin-bottom:22px;border-bottom:1px solid var(--line);
  text-align:center;
}
h1{
  margin:0;font-family:var(--display);font-size:clamp(34px,5.5vw,49px);
  font-weight:800;font-stretch:112%;letter-spacing:-.018em;line-height:1.02;
  text-wrap:balance;
}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr) 338px;gap:22px;align-items:start}
@media (max-width:980px){.shell{grid-template-columns:1fr}}

/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.bed{
  background:var(--bed);
  border:1px solid var(--line);border-radius:14px;
  padding:clamp(16px,3.4vw,40px);
  background-image:repeating-linear-gradient(90deg,transparent 0 23px,rgba(128,132,142,.07) 23px 24px);
}
.card-hold{position:relative;max-width:100%;margin:0 auto;--cr:5.5%/8.72%}
.card-hold canvas{
  display:block;width:100%;height:auto;max-width:100%;
  border-radius:var(--cr);
  box-shadow:var(--shadow-card);
  touch-action:none;cursor:grab;
  background:var(--panel-2);
}
.card-hold.dragging canvas{cursor:grabbing}
.drop-hint{
  position:absolute;inset:0;display:none;place-items:center;
  border-radius:var(--cr);background:rgba(199,154,62,.16);
  border:2px dashed var(--foil-bg);
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--foil);
}
.bed.over .drop-hint{display:grid}

/* preset tray */
.tray{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.preset{
  border:1px solid var(--line);background:none;padding:0;border-radius:8px;
  overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
  font:inherit;color:var(--ink-2);text-align:left;
}
.preset canvas{display:block;width:100%;height:auto;aspect-ratio:1536/969}
.preset span{
  padding:5px 7px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;
  border-top:1px solid var(--line-soft);
}
.preset:hover{border-color:var(--ink-3)}
.marks{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.mark{
  border:1px solid var(--line);background:var(--panel-2);border-radius:7px;
  padding:6px;cursor:pointer;display:grid;place-items:center;aspect-ratio:1.45;
}
.mark img{max-width:100%;max-height:100%;display:block}
.mark:hover{border-color:var(--ink-3)}
.mark[aria-pressed="true"]{border-color:var(--foil-bg);background:var(--foil-tint)}
.preset-add{
  border:1px dashed var(--line);background:var(--panel-2);border-radius:8px;
  cursor:pointer;color:var(--ink-3);display:grid;place-items:center;min-height:62px;
}
.preset-add:hover{border-color:var(--foil-bg);color:var(--foil)}
.preset-add svg{width:24px;height:24px;display:block}
.preset[aria-pressed="true"]{border-color:var(--foil-bg);box-shadow:0 0 0 1px var(--foil-bg)}
.preset[aria-pressed="true"] span{background:var(--foil-tint);color:var(--foil);font-weight:600}

/* ---------- rail ---------- */
.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.mod{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.mod>summary{
  list-style:none;cursor:pointer;padding:11px 13px;
  display:flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-2);background:var(--panel-2);border-bottom:1px solid transparent;
}
.mod>summary::-webkit-details-marker{display:none}
.mod[open]>summary{border-bottom-color:var(--line)}
.mod>summary::before{
  content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-3);flex:none;
}
.mod[open]>summary::before{background:var(--foil-bg)}
.mod>summary::after{content:"+";margin-left:auto;font-size:13px;color:var(--ink-3)}
.mod[open]>summary::after{content:"–"}
.mod-body{padding:13px;display:flex;flex-direction:column;gap:13px}

.field{display:flex;flex-direction:column;gap:6px}
.field>label,.rowlab{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
}
.valrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.val{font-family:var(--mono);font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:18px;background:none;cursor:pointer;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--panel);border:2px solid var(--foil-bg);margin-top:-5.5px;
}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;background:var(--panel);border:2px solid var(--foil-bg);
}
input[type=text],select{
  width:100%;font:inherit;font-size:13px;color:var(--ink);
  background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;
}
input[type=color]{
  width:100%;height:30px;padding:2px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:7px;cursor:pointer;
}
:focus-visible{outline:2px solid var(--foil-bg);outline-offset:2px}

.btn{
  font:inherit;font-size:13px;font-weight:500;cursor:pointer;
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  border-radius:8px;padding:9px 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn:hover{border-color:var(--ink-3)}
.btn-foil{
  background:var(--foil-bg);border-color:var(--foil-bg);color:var(--foil-on);font-weight:600;
}
.btn-foil:hover{filter:brightness(1.06);border-color:var(--foil-bg)}
.btn-wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}


.toggle{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.toggle input{accent-color:var(--foil-bg);width:15px;height:15px;flex:none;cursor:pointer}

.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pos-grid button{
  aspect-ratio:1.585;border:1px solid var(--line);background:var(--panel-2);
  border-radius:5px;cursor:pointer;position:relative;
}
.pos-grid button::after{
  content:"";position:absolute;width:38%;height:3px;border-radius:2px;background:var(--ink-3);
}
.pos-grid button[data-p^="t"]::after{top:22%}
.pos-grid button[data-p^="m"]::after{top:calc(50% - 1.5px)}
.pos-grid button[data-p^="b"]::after{bottom:22%}
.pos-grid button[data-p$="l"]::after{left:16%}
.pos-grid button[data-p$="c"]::after{left:31%}
.pos-grid button[data-p$="r"]::after{right:16%}
.pos-grid button[aria-pressed="true"]{border-color:var(--foil-bg);background:var(--foil-tint)}
.pos-grid button[aria-pressed="true"]::after{background:var(--foil-bg)}


.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="masthead">
    <h1>cardwallet-template</h1>
  </header>

  <div class="shell">
    <!-- ================= STAGE ================= -->
    <section class="stage">
      <div class="bed" id="bed">
        <div class="card-hold" id="hold">
          <canvas id="card" width="1536" height="969" aria-label="카드 스킨 미리보기"></canvas>
          <div class="drop-hint">이미지를 놓으세요</div>
        </div>
      </div>

      <div class="tray">
        <div class="presets" id="presets">
          <button class="preset-add" type="button" id="pick" aria-label="사진 불러오기">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <input type="file" id="file" class="hidden-file" accept="image/*">
      </div>
    </section>

    <!-- ================= RAIL ================= -->
    <aside class="rail">
      <details class="mod" open>
        <summary>배치</summary>
        <div class="mod-body">
          <div class="field">
            <div class="valrow"><label for="zoom">확대</label><span class="val" id="v-zoom">100%</span></div>
            <input type="range" id="zoom" min="100" max="400" value="100" step="1">
          </div>
          <div class="field">
            <div class="valrow"><label for="rot">회전</label><span class="val" id="v-rot">0°</span></div>
            <input type="range" id="rot" min="-180" max="180" value="0" step="1">
          </div>
          <div class="btn-row">
            <button class="btn" id="center">가운데로</button>
            <button class="btn" id="resetview">배치 초기화</button>
          </div>
        </div>
      </details>

      <details class="mod">
        <summary>보정</summary>
        <div class="mod-body">
          <div class="field">
            <div class="valrow"><label for="bri">밝기</label><span class="val" id="v-bri">100%</span></div>
            <input type="range" id="bri" min="20" max="200" value="100">
          </div>
          <div class="field">
            <div class="valrow"><label for="con">대비</label><span class="val" id="v-con">100%</span></div>
            <input type="range" id="con" min="20" max="200" value="100">
          </div>
          <div class="field">
            <div class="valrow"><label for="sat">채도</label><span class="val" id="v-sat">100%</span></div>
            <input type="range" id="sat" min="0" max="220" value="100">
          </div>
          <div class="field">
            <div class="valrow"><label for="blur">흐림</label><span class="val" id="v-blur">0 px</span></div>
            <input type="range" id="blur" min="0" max="60" value="0">
          </div>
          <button class="btn btn-wide" id="resetadj">보정 초기화</button>
        </div>
      </details>

      <details class="mod">
        <summary>마감</summary>
        <div class="mod-body">
          <div class="field">
            <div class="valrow"><label for="vig">비네팅</label><span class="val" id="v-vig">18%</span></div>
            <input type="range" id="vig" min="0" max="80" value="18">
          </div>
          <div class="field">
            <div class="valrow"><label for="grain">그레인</label><span class="val" id="v-grain">6%</span></div>
            <input type="range" id="grain" min="0" max="60" value="6">
          </div>
          <div class="field">
            <label for="tint">틴트</label>
            <input type="color" id="tint" value="#0A1C2E">
          </div>
          <div class="field">
            <div class="valrow"><span class="rowlab">틴트 농도</span><span class="val" id="v-tinta">0%</span></div>
            <input type="range" id="tinta" min="0" max="90" value="0" aria-label="틴트 농도">
          </div>
        </div>
      </details>

      <details class="mod">
        <summary>레터링</summary>
        <div class="mod-body">
          <div class="field">
            <label for="text">문구</label>
            <input type="text" id="text" value="CARDWALLET" maxlength="28" placeholder="비워두면 표시되지 않습니다">
          </div>
          <div class="field">
            <label for="tfont">서체</label>
            <select id="tfont">
              <option value="Archivo">Archivo · 확장 산세리프</option>
              <option value="Azeret Mono">Azeret Mono · 모노</option>
              <option value="Instrument Sans">Instrument Sans · 산세리프</option>
              <option value="Georgia">Georgia · 세리프</option>
            </select>
          </div>
          <div class="field">
            <span class="rowlab">위치</span>
            <div class="pos-grid" id="pos" role="group" aria-label="문구 위치"></div>
          </div>
          <div class="field">
            <div class="valrow"><label for="tsize">크기</label><span class="val" id="v-tsize">58 px</span></div>
            <input type="range" id="tsize" min="20" max="180" value="58">
          </div>
          <div class="field">
            <div class="valrow"><label for="track">자간</label><span class="val" id="v-track">10</span></div>
            <input type="range" id="track" min="-10" max="60" value="10">
          </div>
          <div class="field">
            <label for="tcolor">색</label>
            <input type="color" id="tcolor" value="#F4F1EA">
          </div>
          <label class="toggle"><input type="checkbox" id="tshadow" checked> 그림자로 가독성 보강</label>
        </div>
      </details>

      <details class="mod">
        <summary>마크</summary>
        <div class="mod-body">
          <div class="marks" id="marks"></div>
        </div>
      </details>

      <button class="btn btn-foil btn-wide" id="export">PNG로 내보내기</button>
    </aside>
  </div>
</div>

<script>
(function(){
"use strict";
const W = 1536, H = 969, RADIUS = 85;

/* ---------- seeded rng ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- presets ---------- */
function titanium(ctx,w,h,R){
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#E8E9EB");g.addColorStop(.26,"#C6C9CF");g.addColorStop(.5,"#EFF0F2");
  g.addColorStop(.74,"#BFC2C9");g.addColorStop(1,"#DDDFE3");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.save();ctx.globalAlpha=.15;
  for(let i=0;i<1400;i++){
    const y=R()*h,x=R()*w;
    ctx.strokeStyle=R()>.5?"#FFFFFF":"#878B94";
    ctx.lineWidth=R()*1.7+.25;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+R()*460+60,y+(R()-.5)*1.6);ctx.stroke();
  }
  ctx.restore();
  const s=ctx.createLinearGradient(0,h,w,0);
  s.addColorStop(0,"rgba(255,255,255,0)");s.addColorStop(.42,"rgba(255,255,255,.34)");
  s.addColorStop(.56,"rgba(255,255,255,.06)");s.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=s;ctx.fillRect(0,0,w,h);
}
function midnight(ctx,w,h,R){
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,"#16233A");g.addColorStop(.55,"#0B1120");g.addColorStop(1,"#050810");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  const f=ctx.createLinearGradient(w*.1,h,w*.9,0);
  f.addColorStop(0,"rgba(199,154,62,0)");f.addColorStop(.46,"rgba(226,188,110,.42)");
  f.addColorStop(.52,"rgba(255,232,178,.62)");f.addColorStop(.58,"rgba(199,154,62,.3)");
  f.addColorStop(1,"rgba(199,154,62,0)");
  ctx.fillStyle=f;ctx.fillRect(0,0,w,h);
  ctx.save();ctx.globalAlpha=.5;
  for(let i=0;i<260;i++){const x=R()*w,y=R()*h,r=R()*2.2;
    ctx.fillStyle="rgba(255,236,190,"+(R()*.6+.1).toFixed(3)+")";
    ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();}
  ctx.restore();
}
/* Japanese IC transit cards (Suica / PASMO).
   실제 카드의 배색·웨이브 형태·워드마크 배치를 따라 그립니다.
   마스코트 일러스트(스이카 펭귄, 파스모 로봇)는 별개 저작물이라 포함하지 않습니다. */
/* 단색 바탕 + 도트 텍스처. 선택적으로 아트워크 한 장 */
function flatCard(ctx,w,h,R,c){
  ctx.fillStyle=c.base;ctx.fillRect(0,0,w,h);
  ctx.save();ctx.globalAlpha=c.dotA;ctx.fillStyle=c.dot;
  for(let y=0;y<h;y+=16){
    const off=(y/16)%2?8:0;
    for(let x=off;x<w;x+=16)ctx.fillRect(x,y,2.4,2.4);
  }
  ctx.restore();
  /* x·y·h 는 카드 기준 비율. 폭은 원본 비율로 따라간다 */
  (c.art||[]).forEach(function(it){
    const m=cardArt[it.key];
    if(!m||!m.complete||!m.naturalWidth)return;
    const ah=h*it.h,aw=ah*m.naturalWidth/m.naturalHeight;
    ctx.drawImage(m,w*it.x,h*it.y,aw,ah);
  });
}
const cardArt={};
/* 실제 Apple Wallet Suica 카드에서 실측한 비율 */
const SUICA={base:"#DDDEDB",dot:"#FFFFFF",dotA:.055,art:[
  {key:"suicafield",x:.0297,y:.0545,h:.8933},
  {key:"suicalogo", x:.8032,y:.0558,h:.1515},
  {key:"penguin",   x:.7590,y:.5273,h:.4158}
]};
/* PASMO_Card.svg 에서 실측한 비율 */
const PASMO={base:"#DCDCDA",dot:"#6E6E6A",dotA:.05,art:[
  {key:"pasmo",x:.1013,y:.1274,h:.7509}
]};

const PRESETS=[
  {id:"titanium",name:"티타늄",draw:titanium,seed:7},
  {id:"midnight",name:"미드나이트 포일",draw:midnight,seed:19},
  {id:"suica",name:"Suica",seed:13,noText:true,noFx:true,
    draw:function(ctx,w,h,R){flatCard(ctx,w,h,R,SUICA)}},
  {id:"pasmo",name:"PASMO",seed:17,noText:true,noFx:true,
    draw:function(ctx,w,h,R){flatCard(ctx,w,h,R,PASMO)}}
];
const byId={};PRESETS.forEach(function(p){byId[p.id]=p});

/* ---------- state ---------- */
const state={
  mode:"preset", preset:"titanium",
  photo:null,
  zoom:1, rot:0, ox:0, oy:0,
  bri:100, con:100, sat:100, blur:0,
  vig:18, grain:6, tint:"#0A1C2E", tinta:0,
  text:"CARDWALLET", tfont:"Archivo", tpos:"bl", tsize:58, track:10,
  tcolor:"#F4F1EA", tshadow:true,
  marks:[]
};

const card=document.getElementById("card");
const ctx=card.getContext("2d");
const base=document.createElement("canvas");base.width=W;base.height=H;
const bctx=base.getContext("2d");

/* grain tile */
const grainTile=(function(){
  const c=document.createElement("canvas");c.width=c.height=180;
  const g=c.getContext("2d"),d=g.createImageData(180,180),R=mulberry32(99);
  for(let i=0;i<d.data.length;i+=4){const v=(R()*255)|0;
    d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  g.putImageData(d,0,0);return c;
})();

let presetCacheKey=null,presetCache=null;
function drawBase(){
  bctx.setTransform(1,0,0,1,0,0);
  bctx.clearRect(0,0,W,H);
  if(state.mode==="photo"&&state.photo){
    const img=state.photo,iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
    const cover=Math.max(W/iw,H/ih),sc=cover*state.zoom;
    bctx.save();
    bctx.translate(W/2+state.ox,H/2+state.oy);
    bctx.rotate(state.rot*Math.PI/180);
    bctx.drawImage(img,-iw*sc/2,-ih*sc/2,iw*sc,ih*sc);
    bctx.restore();
  }else{
    const key=state.preset;
    if(presetCacheKey!==key){
      const p=byId[state.preset];
      const c=document.createElement("canvas");c.width=W;c.height=H;
      p.draw(c.getContext("2d"),W,H,mulberry32(p.seed));
      presetCache=c;presetCacheKey=key;
    }
    bctx.drawImage(presetCache,0,0);
  }
}

function render(){
  const cur=byId[state.preset];
  /* 프리셋 원본 그대로 내보내는 카드: 보정·마감을 건너뛴다 */
  const raw=state.mode==="preset"&&cur&&cur.noFx;

  drawBase();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  const f=[];
  if(!raw){
    if(state.bri!==100)f.push("brightness("+state.bri+"%)");
    if(state.con!==100)f.push("contrast("+state.con+"%)");
    if(state.sat!==100)f.push("saturate("+state.sat+"%)");
    if(state.blur>0)f.push("blur("+state.blur+"px)");
  }
  ctx.filter=f.length?f.join(" "):"none";
  const o=f.length&&state.blur>0?state.blur*2.5:0;
  ctx.drawImage(base,-o,-o,W+o*2,H+o*2);
  ctx.restore();

  if(!raw&&state.tinta>0){
    ctx.save();ctx.globalAlpha=state.tinta/100;
    ctx.fillStyle=state.tint;ctx.fillRect(0,0,W,H);ctx.restore();
  }
  if(!raw&&state.vig>0){
    const g=ctx.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,W*.72);
    g.addColorStop(0,"rgba(0,0,0,0)");
    g.addColorStop(.62,"rgba(0,0,0,"+(state.vig/100*.32).toFixed(3)+")");
    g.addColorStop(1,"rgba(0,0,0,"+(state.vig/100).toFixed(3)+")");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  if(!raw&&state.grain>0){
    ctx.save();
    ctx.globalAlpha=state.grain/100*.55;
    ctx.globalCompositeOperation="overlay";
    ctx.fillStyle=ctx.createPattern(grainTile,"repeat");
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  if(!(state.mode==="preset"&&cur&&cur.noText))drawText();
  drawMarks();

  {
    ctx.save();
    ctx.globalCompositeOperation="destination-in";
    cornerPath(ctx,0,0,W,H,RADIUS);
    ctx.fillStyle="#000";ctx.fill();
    ctx.restore();
  }
}

function cornerPath(ctx,x,y,w,h,r){
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,w,h,r);return}
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

/* the element radius follows the pixels so the drop shadow matches */
function syncCorner(){
  const r=RADIUS;
  hold.style.setProperty("--cr",
    r?(r/W*100).toFixed(3)+"% / "+(r/H*100).toFixed(3)+"%":"0px");
}

const MARKS=[
  {id:"applepay",name:"Apple Pay"},{id:"contactless",name:"비접촉"},
  {id:"id",name:"iD"},{id:"quicpay",name:"QUICPay"},
  {id:"suica",name:"Suica"},{id:"ic",name:"IC"},
  {id:"pasmo",name:"PASMO"},{id:"icoca",name:"ICOCA"},
  {id:"nanaco",name:"nanaco"},{id:"waon",name:"WAON"}
];
const markImgs={};

/* 고른 순서대로 카드 우하단에 한 줄 */
function drawMarks(){
  const ids=state.marks.filter(function(id){
    const m=markImgs[id];return m&&m.complete&&m.naturalWidth;
  });
  if(!ids.length)return;
  const mh=H*.105,gap=H*.030,padX=W*.045,padY=H*.075;
  const ws=ids.map(function(id){
    const m=markImgs[id];return mh*m.naturalWidth/m.naturalHeight;
  });
  const total=ws.reduce(function(a,b){return a+b},0)+gap*(ids.length-1);
  let x=W-padX-total;
  const y=H-padY-mh;
  ids.forEach(function(id,i){ctx.drawImage(markImgs[id],x,y,ws[i],mh);x+=ws[i]+gap});
}

const POS=[["tl","tc","tr"],["ml","mc","mr"],["bl","bc","br"]];
function drawText(){
  const t=state.text.trim();if(!t)return;
  const pad=92,size=state.tsize;
  ctx.save();
  ctx.font='600 '+size+'px "'+state.tfont+'", sans-serif';
  ctx.textBaseline="middle";
  const tr=state.track;
  const chars=t.split("");
  let total=0;chars.forEach(function(ch,i){total+=ctx.measureText(ch).width+(i<chars.length-1?tr:0)});
  const v=state.tpos[0],hz=state.tpos[1];
  let y=v==="t"?pad+size*.55:v==="b"?H-pad-size*.55:H/2;
  let x=hz==="l"?pad:hz==="r"?W-pad-total:(W-total)/2;
  if(state.tshadow){ctx.shadowColor="rgba(0,0,0,.55)";ctx.shadowBlur=size*.34;ctx.shadowOffsetY=size*.06;}
  ctx.fillStyle=state.tcolor;
  chars.forEach(function(ch){ctx.fillText(ch,x,y);x+=ctx.measureText(ch).width+tr});
  ctx.restore();
}

/* ---------- preset thumbnails ---------- */
const tray=document.getElementById("presets");
const repaintThumbs=[];
PRESETS.forEach(function(p){
  const b=document.createElement("button");
  b.className="preset";b.type="button";b.dataset.id=p.id;
  b.setAttribute("aria-pressed",p.id===state.preset);
  const c=document.createElement("canvas");c.width=256;c.height=161;
  const cc=c.getContext("2d");
  const paint=function(){
    cc.setTransform(1,0,0,1,0,0);cc.clearRect(0,0,256,161);
    cc.save();cc.scale(256/W,161/H);
    p.draw(cc,W,H,mulberry32(p.seed));cc.restore();
  };
  paint();repaintThumbs.push(paint);
  const s=document.createElement("span");s.textContent=p.name;
  b.appendChild(c);b.appendChild(s);
  b.addEventListener("click",function(){
    state.preset=p.id;state.mode="preset";
    [].forEach.call(tray.querySelectorAll(".preset"),function(n){n.setAttribute("aria-pressed",n===b)});
    render();
  });
  tray.appendChild(b);
});

/* ---------- position grid ---------- */
const posGrid=document.getElementById("pos");
POS.forEach(function(row){row.forEach(function(p){
  const b=document.createElement("button");
  b.type="button";b.dataset.p=p;b.setAttribute("aria-pressed",p===state.tpos);
  b.setAttribute("aria-label","문구 위치 "+p);
  b.addEventListener("click",function(){
    state.tpos=p;
    [].forEach.call(posGrid.children,function(n){n.setAttribute("aria-pressed",n===b)});
    render();
  });
  posGrid.appendChild(b);
})});

/* ---------- bindings ---------- */
function bindRange(id,key,fmt,after){
  const el=document.getElementById(id),out=document.getElementById("v-"+id);
  el.addEventListener("input",function(){
    state[key]=parseFloat(el.value);
    if(out)out.textContent=fmt(state[key]);
    if(after)after();
    render();
  });
  if(out)out.textContent=fmt(state[key]);
}
const pct=function(v){return v+"%"},px=function(v){return v+" px"};
(function(){
  const el=document.getElementById("zoom"),out=document.getElementById("v-zoom");
  el.addEventListener("input",function(){
    state.zoom=parseFloat(el.value)/100;
    out.textContent=Math.round(state.zoom*100)+"%";
    render();
  });
})();
bindRange("rot","rot",function(v){return v+"°"});
bindRange("bri","bri",pct);bindRange("con","con",pct);
bindRange("sat","sat",pct);bindRange("blur","blur",px);
bindRange("vig","vig",pct);bindRange("grain","grain",pct);
bindRange("tinta","tinta",pct);
bindRange("tsize","tsize",px);
bindRange("track","track",function(v){return String(v)});
document.getElementById("v-zoom").textContent="100%";

document.getElementById("tint").addEventListener("input",function(e){state.tint=e.target.value;render()});
document.getElementById("tcolor").addEventListener("input",function(e){state.tcolor=e.target.value;render()});
document.getElementById("text").addEventListener("input",function(e){state.text=e.target.value;render()});
document.getElementById("tfont").addEventListener("change",function(e){state.tfont=e.target.value;render()});
document.getElementById("tshadow").addEventListener("change",function(e){state.tshadow=e.target.checked;render()});

const hold=document.getElementById("hold");

document.getElementById("center").addEventListener("click",function(){state.ox=0;state.oy=0;render()});
document.getElementById("resetview").addEventListener("click",function(){
  state.ox=0;state.oy=0;state.zoom=1;state.rot=0;
  document.getElementById("zoom").value=100;document.getElementById("v-zoom").textContent="100%";
  document.getElementById("rot").value=0;document.getElementById("v-rot").textContent="0°";
  render();
});
document.getElementById("resetadj").addEventListener("click",function(){
  [["bri",100,pct],["con",100,pct],["sat",100,pct],["blur",0,px]].forEach(function(r){
    state[r[0]]=r[1];document.getElementById(r[0]).value=r[1];
    document.getElementById("v-"+r[0]).textContent=r[2](r[1]);
  });
  render();
});

/* ---------- photo input ---------- */
const fileInput=document.getElementById("file");
document.getElementById("pick").addEventListener("click",function(){fileInput.click()});
fileInput.addEventListener("change",function(){if(fileInput.files[0])loadFile(fileInput.files[0])});
function loadFile(file){
  if(!file.type.startsWith("image/"))return;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    state.photo=img;state.mode="photo";
    state.ox=0;state.oy=0;
    [].forEach.call(tray.querySelectorAll(".preset"),function(n){n.setAttribute("aria-pressed",false)});
    render();
  };
  img.onerror=function(){URL.revokeObjectURL(url)};
  img.src=url;
}
const bed=document.getElementById("bed");
["dragenter","dragover"].forEach(function(t){bed.addEventListener(t,function(e){e.preventDefault();bed.classList.add("over")})});
["dragleave","drop"].forEach(function(t){bed.addEventListener(t,function(e){e.preventDefault();if(t==="drop"||e.target===bed)bed.classList.remove("over")})});
bed.addEventListener("drop",function(e){const f=e.dataTransfer.files[0];if(f)loadFile(f)});

/* ---------- pan & wheel ---------- */
let dragging=false,lx=0,ly=0;
card.addEventListener("pointerdown",function(e){
  if(state.mode!=="photo")return;
  dragging=true;lx=e.clientX;ly=e.clientY;hold.classList.add("dragging");
  card.setPointerCapture(e.pointerId);
});
card.addEventListener("pointermove",function(e){
  if(!dragging)return;
  const k=W/card.getBoundingClientRect().width;
  state.ox+=(e.clientX-lx)*k;state.oy+=(e.clientY-ly)*k;
  lx=e.clientX;ly=e.clientY;render();
});
["pointerup","pointercancel"].forEach(function(t){
  card.addEventListener(t,function(){dragging=false;hold.classList.remove("dragging")});
});
card.addEventListener("wheel",function(e){
  if(state.mode!=="photo")return;
  e.preventDefault();
  const z=Math.min(4,Math.max(1,state.zoom*(e.deltaY<0?1.06:1/1.06)));
  state.zoom=z;
  const s=document.getElementById("zoom");
  s.value=Math.round(z*100);document.getElementById("v-zoom").textContent=Math.round(z*100)+"%";
  render();
},{passive:false});

/* ---------- export ---------- */
function safeName(){
  const p=byId[state.preset];
  const n=((p&&p.name)||state.preset).replace(/[\\/:*?"<>|]/g,"-").trim();
  return "cardwallet-template-"+n+".png";
}
document.getElementById("export").addEventListener("click",function(){
  const btn=this;btn.disabled=true;
  card.toBlob(async function(blob){
    if(!blob){btn.disabled=false;return}
    const name=safeName();
    let dl=null;
    try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(err){dl=null}
    if(dl){
      try{await dl.save({filename:name,data:blob});}catch(err){}
    }else{
      const url=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},4000);
    }
    btn.disabled=false;
  },"image/png");
});

/* ---------- mark picker ---------- */
(function(){
  const box=document.getElementById("marks");
  MARKS.forEach(function(mk){
    const b=document.createElement("button");
    b.type="button";b.className="mark";b.setAttribute("aria-pressed","false");
    b.title=mk.name;
    const img=document.createElement("img");
    img.src="marks/"+mk.id+".png";img.alt=mk.name;
    img.addEventListener("load",function(){if(state.marks.indexOf(mk.id)>=0)render()});
    markImgs[mk.id]=img;
    b.appendChild(img);
    b.addEventListener("click",function(){
      const i=state.marks.indexOf(mk.id);
      if(i>=0)state.marks.splice(i,1);else state.marks.push(mk.id);
      b.setAttribute("aria-pressed",i<0);
      render();
    });
    box.appendChild(b);
  });
})();

/* ---------- card artwork ---------- */
[["pasmo","pasmo.png"],["penguin","suica-penguin.png"],["suicalogo","suica-logo.png"],["suicafield","suica-field.png"]].forEach(function(e){
  const img=new Image();
  img.onload=function(){
    cardArt[e[0]]=img;presetCacheKey=null;
    repaintThumbs.forEach(function(f){f()});
    render();
  };
  img.src=e[1];
});

/* ---------- boot ---------- */
syncCorner();
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){
  presetCacheKey=null;                 /* 워드마크가 대체 서체로 캐시됐을 수 있음 */
  repaintThumbs.forEach(function(f){f()});
  render();
});
})();
</script>
